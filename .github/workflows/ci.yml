# Kör testerna på varje PR och push till main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bygg
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # Sparade Word- och ODT-filer från korpusen ska gå att öppna i LibreOffice (tests/corpus).
  libreoffice:
    name: korpus i LibreOffice
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Installera LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Korpustester med LibreOffice
        env:
          KLADD_CORPUS_SOFFICE: "1"
        run: cargo test --locked corpus_soffice -- --ignored --test-threads=1
