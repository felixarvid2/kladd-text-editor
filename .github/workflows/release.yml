# Bygger ett .deb-paket och skapar en GitHub-release.
#
# Två sätt att släppa en ny version (höj först `version` i Cargo.toml):
#   1. Pusha en tagg:  git tag v1.4.0 && git push origin v1.4.0
#      Taggen måste stämma med versionen i Cargo.toml.
#   2. Kör workflowen för hand (Actions → Release → Run workflow) med
#      "Publicera release" ikryssat. Då skapas taggen v<version> på den valda
#      grenens senaste commit.
# Körs workflowen för hand utan kryss byggs paketet bara som en artefakt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicera release (skapar taggen v<version> från Cargo.toml)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deb:
    # 22.04 ger ett paket som också fungerar på nyare Ubuntu (äldre glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bestäm version och tagg
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Taggen $GITHUB_REF_NAME stämmer inte med versionen $version i Cargo.toml"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Test
        run: cargo test --locked

      - name: Bygg .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v4
        with:
          name: kladd-deb
          path: target/debian/*.deb

      - name: Skapa release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" target/debian/*.deb \
            --target "$GITHUB_SHA" \
            --title "Kladd $VERSION" \
            --generate-notes
