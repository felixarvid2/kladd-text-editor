# Bygger paket för Linux (.deb och AppImage), Windows (installationsprogram och zip) och
# macOS (.dmg, universell) och skapar en GitHub-release med alla.
#
# Kodsignering är valfri och styrs av repots hemligheter (Settings → Secrets and variables
# → Actions). Saknas hemligheterna byggs allt osignerat (Windows) respektive ad hoc-signerat
# (macOS), precis som förut. Se docs/dev/signering.md för namn och hur man skaffar dem.
#
# Två sätt att släppa en ny version (höj först `version` i Cargo.toml):
#   1. Pusha en tagg:  git tag v1.4.0 && git push origin v1.4.0
#      Taggen måste stämma med versionen i Cargo.toml.
#   2. Kör workflowen för hand (Actions → Release → Run workflow) med
#      "Publicera release" ikryssat. Då skapas taggen v<version> på den valda
#      grenens senaste commit.
# Körs workflowen för hand utan kryss byggs paketen bara som artefakter.
# Release-anteckningarna hämtas från avsnittet för versionen i CHANGELOG.md
# (annars genereras de automatiskt). För en redan publicerad release: kör
# workflowen för hand med "update_notes" ifylld (t.ex. v1.5.0); då byts bara
# anteckningarna ut, inget byggs och ingen release skapas.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicera release (skapar taggen v<version> från Cargo.toml)"
        type: boolean
        default: false
      update_notes:
        description: "Uppdatera bara anteckningarna för en befintlig release (tagg, t.ex. v1.5.0) från CHANGELOG.md"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  notes:
    # Byter ut anteckningarna på en befintlig release. Rör inget annat.
    if: github.event_name == 'workflow_dispatch' && inputs.update_notes != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Uppdatera release-anteckningar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.update_notes }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Ogiltig tagg '$TAG' (förväntat t.ex. v1.5.0)"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md har inget avsnitt för $VERSION"
            exit 1
          fi
          printf '\nFullständig ändringslogg: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  meta:
    # Läser versionen och kontrollerar taggen en gång för alla byggjobb.
    if: github.event_name != 'workflow_dispatch' || inputs.update_notes == ''
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Bestäm version och tagg
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Taggen $GITHUB_REF_NAME stämmer inte med versionen $version i Cargo.toml"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  deb:
    needs: meta
    # 22.04 ger ett paket som också fungerar på nyare Ubuntu (äldre glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Test
        run: cargo test --locked

      - name: Bygg .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v4
        with:
          name: kladd-deb
          path: target/debian/*.deb
          if-no-files-found: error

  appimage:
    needs: meta
    # 22.04 (äldre glibc) så att AppImagen går att köra på så många system som möjligt.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bygg
        run: cargo build --release --locked

      - name: Bygg AppImage
        # linuxdeploy tar inte med libGL, libEGL, libwayland, libX* m.fl. (grafiken kommer
        # från värden). Skriptet kör verktygen med APPIMAGE_EXTRACT_AND_RUN eftersom FUSE saknas.
        run: packaging/linux/build-appimage.sh "${{ needs.meta.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: kladd-appimage
          path: dist/Kladd-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Valfri signering: hemligheter kan inte användas direkt i `if:`, därför går de via env.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bygg
        run: cargo build --release --locked

      - name: Signera kladd.exe
        # Hoppas över utan certifikat. Signeras före zip och installationsprogram så att
        # båda innehåller den signerade filen.
        if: env.WINDOWS_CERT_PFX_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != ''
        shell: pwsh
        run: |
          . packaging\windows\sign.ps1
          Initialize-Signing
          Sign-File target\release\kladd.exe

      - name: Zip
        run: |
          name="Kladd-${VERSION}-windows-x64"
          mkdir -p "dist/$name/licenses"
          cp target/release/kladd.exe README.md LICENSE "dist/$name/"
          cp assets/fonts/OFL.txt "dist/$name/licenses/FONT-LICENSE.txt"
          cp assets/fonts/Carlito-OFL.txt "dist/$name/licenses/CARLITO-FONT-LICENSE.txt"
          cp assets/fonts/STIXTwo-OFL.txt "dist/$name/licenses/STIXTWO-FONT-LICENSE.txt"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name' -DestinationPath 'dist/$name.zip'"
          rm -rf "dist/$name"

      - name: Installera Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Bygg installationsprogram
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\kladd.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Signera installationsprogrammet
        if: env.WINDOWS_CERT_PFX_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != ''
        shell: pwsh
        run: |
          . packaging\windows\sign.ps1
          Initialize-Signing
          Get-ChildItem dist\*-setup.exe | ForEach-Object { Sign-File $_.FullName }
          Remove-Item -Force $env:RUNNER_TEMP\kladd-cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: kladd-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Valfri signering och notarisering (se docs/dev/signering.md). Utan dem används ad hoc-signering.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Bygg för Apple Silicon och Intel
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Bygg Kladd.app
        run: |
          app="dist/dmg/Kladd.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/licenses"
          lipo -create -output "$app/Contents/MacOS/kladd" \
            target/aarch64-apple-darwin/release/kladd \
            target/x86_64-apple-darwin/release/kladd
          lipo -info "$app/Contents/MacOS/kladd"
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp packaging/icons/kladd.icns "$app/Contents/Resources/kladd.icns"
          cp LICENSE README.md "$app/Contents/Resources/licenses/"
          cp assets/fonts/OFL.txt "$app/Contents/Resources/licenses/FONT-LICENSE.txt"
          cp assets/fonts/Carlito-OFL.txt "$app/Contents/Resources/licenses/CARLITO-FONT-LICENSE.txt"
          cp assets/fonts/STIXTwo-OFL.txt "$app/Contents/Resources/licenses/STIXTWO-FONT-LICENSE.txt"

      - name: Importera certifikat
        # Läggs i en tillfällig nyckelring som tas bort sist i jobbet.
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/kladd-signing.keychain-db"
          kcpass=$(uuidgen)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kcpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KLADD_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Signera Kladd.app
        run: |
          app="dist/dmg/Kladd.app"
          if [ -n "${KLADD_KEYCHAIN:-}" ]; then
            # Developer ID: härdad körmiljö och tidsstämpel krävs för notarisering.
            codesign --force --deep --options runtime --timestamp \
              --entitlements packaging/macos/kladd.entitlements \
              -s "$MACOS_SIGN_IDENTITY" --keychain "$KLADD_KEYCHAIN" "$app"
          else
            # Ad hoc-signering (ingen utvecklarfil) krävs för att appen ska starta på Apple Silicon.
            codesign --force --deep -s - "$app"
          fi
          codesign --verify --deep --strict "$app"

      - name: Skapa .dmg
        run: |
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Kladd -srcfolder dist/dmg -ov -format UDZO \
            "dist/Kladd-${VERSION}-macos-universal.dmg"

      - name: Signera .dmg
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          codesign --force --timestamp -s "$MACOS_SIGN_IDENTITY" --keychain "$KLADD_KEYCHAIN" \
            "dist/Kladd-${VERSION}-macos-universal.dmg"

      - name: Notarisera och nita fast kvittot
        # Kräver också Apple-kontouppgifterna. Utan dem blir .dmg:n signerad men inte notariserad.
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.MACOS_SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          dmg="dist/Kladd-${VERSION}-macos-universal.dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Ta bort nyckelringen
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/kladd-signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: kladd-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [meta, deb, appimage, windows, macos]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Skapa release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ls -l artifacts
          # Anteckningarna är avsnittet för versionen i CHANGELOG.md, utan rubrikraden.
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            printf '\nFullständig ändringslogg: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> notes.md
            notes=(--notes-file notes.md)
          else
            echo "::warning::CHANGELOG.md har inget avsnitt för $VERSION, genererar anteckningar automatiskt"
            notes=(--generate-notes)
          fi
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Kladd $VERSION" \
            "${notes[@]}"
