[package]
name = "kladd"
version = "1.4.0"
edition = "2024"
description = "Kladd – en lugn och snygg texteditor för txt, Markdown och kod"
authors = ["Felix"]
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "clipboard",
    "links",
    "system_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["serde"] }
egui_extras = { version = "0.37", features = ["syntect", "image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
imagesize = "0.14"
krilla = { version = "0.8", default-features = false, features = ["raster-images", "simple-text"] }
lopdf = { version = "0.47", default-features = false }
rustybuzz = "0.20"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
spellbook = "0.4"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Felix <felix@localhost>"
copyright = "2026, Felix"
section = "editors"
priority = "optional"
depends = "$auto, libgl1, libegl1, libxkbcommon0, libwayland-client0, libwayland-egl1"
recommends = "zenity, xdg-desktop-portal, hunspell-sv, hunspell-en-us"
extended-description = """\
Kladd är en enkel och snygg texteditor för Ubuntu. Den öppnar och sparar \
vanliga textformat som .txt, .md, Word-dokument (.docx), PDF, .rs, .py, .json, .toml, .yaml, .html, \
.css, .js, .sh, .ini och .csv, med flikar, radnummer, syntaxfärgning, \
sök och ersätt samt förhandsvisning av Markdown."""
assets = [
    ["target/release/kladd", "usr/bin/", "755"],
    ["packaging/kladd.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/kladd.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/48/kladd.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/icons/128/kladd.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/256/kladd.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/kladd/FONT-LICENSE", "644"],
    ["assets/fonts/Carlito-OFL.txt", "usr/share/doc/kladd/CARLITO-FONT-LICENSE", "644"],
    ["README.md", "usr/share/doc/kladd/README.md", "644"],
]
