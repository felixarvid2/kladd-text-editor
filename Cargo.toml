[package]
name = "kladd"
version = "2.17.0"
edition = "2024"
description = "Kladd – en lugn och snygg texteditor för txt, Markdown och kod"
authors = ["Felix"]
license = "MIT"
readme = "README.md"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "clipboard",
    "links",
    "system_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.37", features = ["serde"] }
egui_extras = { version = "0.37", features = ["syntect", "image", "file", "svg"] }
# SVG-bilder rasteriseras till PNG (ren Rust, MIT/Apache-2.0); text i SVG ritas med systemets typsnitt.
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }
# SVG som vektor i PDF (krilla-svg delar usvg/resvg 0.47 med resvg ovan; MIT/Apache-2.0).
krilla-svg = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
imagesize = "0.14"
krilla = { version = "0.8", default-features = false, features = ["raster-images", "simple-text"] }
lopdf = { version = "0.47", default-features = false }
hayro = "0.9"
unicode-normalization = "0.1"
rustybuzz = "0.20"
ttf-parser = "0.25"
# Dubbelriktad text (UAX #9) i presentationer; finns redan i trädet (MIT/Apache-2.0).
unicode-bidi = "0.3"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting", "regex"] }
rfd = "0.18"
arboard = { version = "3.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

encoding_rs = "0.8"
spellbook = "0.4"
fontdb = "0.24"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
# ```mermaid-flödesscheman som SVG (ren Rust, MIT, enda beroendet är thiserror); ritas som diagram i läsläget, dokumentläget och PDF.
mermaid-svg = "0.7"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
ureq = "3.5.2"
sys-locale = "0.3.2"
interprocess = "2.4.8"
dirs = "7.0.0"
similar = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ignore = "0.4.34"
trash = "5.3.0"
# Ljud i bildspelet: avkodning i ren Rust (MPL-2.0) och utmatning via ljudsystemet (Apache-2.0; ALSA på Linux,
# CoreAudio på macOS, WASAPI på Windows).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac"] }
cpal = "0.18"

# Bara på Windows-värdar: bäddar in ikon och versionsinfo i kladd.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false, features = ["eframe"] }

# Skärmlistan för bildspelet (src/pptx/show_screens.rs): RandR via ren Rust, samma version och funktioner som winit drar in.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11rb = { version = "0.13.2", default-features = false, features = ["randr"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Skärmlistan för bildspelet (src/pptx/show_screens.rs): samma version som winit använder.
core-graphics = "0.23.1"
# Apple-händelsen "öppna dokument" från Finder (src/macopen.rs). Samma versioner som winit/eframe drar in.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.deb]
maintainer = "Felix <felix@localhost>"
copyright = "2026, Felix"
section = "editors"
priority = "optional"
depends = "$auto, libgl1, libegl1, libxkbcommon0, libwayland-client0, libwayland-egl1"
suggests = "ffmpeg"
recommends = "zenity, xdg-desktop-portal, hunspell-sv, hunspell-en-us, cups-client"
extended-description = """\
Kladd är en enkel och snygg texteditor för Ubuntu. Den öppnar och sparar \
vanliga textformat som .txt, .md, Word-dokument (.docx), PDF, .rs, .py, .json, .toml, .yaml, .html, \
.css, .js, .sh, .ini och .csv, med flikar, radnummer, syntaxfärgning, \
sök och ersätt samt förhandsvisning av Markdown."""
assets = [
    ["target/release/kladd", "usr/bin/", "755"],
    ["packaging/kladd.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/kladd.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/48/kladd.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/icons/128/kladd.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/256/kladd.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/kladd/FONT-LICENSE", "644"],
    ["assets/fonts/Carlito-OFL.txt", "usr/share/doc/kladd/CARLITO-FONT-LICENSE", "644"],
    ["assets/fonts/STIXTwo-OFL.txt", "usr/share/doc/kladd/STIXTWO-FONT-LICENSE", "644"],
    ["src/pptx/geom/LICENSE-APACHE-POI.txt", "usr/share/doc/kladd/POI-LICENSE", "644"],
    ["src/pptx/geom/NOTICE.md", "usr/share/doc/kladd/POI-NOTICE.md", "644"],
    ["README.md", "usr/share/doc/kladd/README.md", "644"],
]

# Lappade kopior av egui_commonmark och egui_commonmark_backend: fet text i Markdown-visningen ritas
# med ett fett typsnitt, tabeller får linjer och radbrytning, och visningen håller reda på
# var blocken hamnar. Se vendor/egui_commonmark_backend/KLADD.md.
[patch.crates-io]
egui_commonmark = { path = "vendor/egui_commonmark" }
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
